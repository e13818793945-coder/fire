<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 精英顾问陪跑系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="login-wrap">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3L4 7v5c0 5 3.5 8.2 8 9 4.5-.8 8-4 8-9V7l-8-4z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>精英顾问陪跑系统</h1>
    <p class="login-sub">请使用系统分配的账号登录</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="{{ 'flash-error' if category == 'error' else 'flash-ok' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label class="field-label" for="username">账号</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="password">密码</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn-block" type="submit">登录</button>
    </form>
  </div>
</div>
</body>
</html>
